plugins {
    id 'java'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21"
    id("com.gradleup.shadow") version "9.4.2"
}

group = 'com.gardensmc'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "CodeMC"
        url = uri("https://repo.codemc.io/repository/maven-public/")
    }
    maven {
        url = "https://jitpack.io/"
    }
    maven {
        url = "https://maven.enginehub.org/repo/"
    }
    maven {
        url = "https://repo.minebench.de/"
    }
    maven {
        name = "opencollab"
        url = uri("https://repo.opencollab.dev/main/")
    }

}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    paperweight.paperDevBundle("26.1.2.build.+")

    compileOnly("de.tr7zw:item-nbt-api-plugin:2.15.7")
    compileOnly(fileTree("${project.rootDir}/dependencies") { include("*.jar") })
    implementation("de.themoep:inventorygui:1.6.4-SNAPSHOT")
    // downloaded by the server from plugin.yml's libraries instead of shaded, to keep the jar small
    compileOnly("com.zaxxer:HikariCP:5.0.1")
    compileOnly("com.github.ben-manes.caffeine:caffeine:3.1.8")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7.1")
//    compileOnly("com.ghostchu:quickshop-api:6.2.0.9-RELEASE-1")
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    // GardensFurniture's main class implements a Geyser API interface, so it's needed to compile against it
    compileOnly('org.geysermc.geyser:api:2.10.1-SNAPSHOT')
    compileOnly('org.geysermc.floodgate:api:2.2.4-SNAPSHOT')

    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    // unit tests run without a server: the Paper API is only on the classpath, never started
    testImplementation(platform("org.junit:junit-bom:5.12.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("io.papermc.paper:paper-api:26.1.2.build.+")
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks {
    build {
        dependsOn(shadowJar)
    }

    shadowJar {
        relocate("de.themoep", "com.gardensmc.enchants.shaded.inventorygui")
    }

}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
